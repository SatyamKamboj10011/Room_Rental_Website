          - generic [ref=f5e124]:
            - paragraph [ref=f5e125]: Hi Dribbblers!We continue to present the business project in Real Estate domain. Today, we'll show you some shots of custom web app that helps search apartments and houses smooth and easy.
            - paragraph [ref=f5e126]: The screen is visually divided into 3 zones, which differ in functionality. Filter zone allows users to quickly find the accommodation according to the parameters entered. Then the app will show the search details based on the filters applied, including monthly rent price.
            - paragraph [ref=f5e127]: The users can also add objects to their favorites and sort results by price and date added. All the nearest real estate corresponding parameters will be displayed on the map. By clicking on the object, the address and price details appear.
            - paragraph [ref=f5e128]: The detail screen enables rental seekers to view the photos of chosen accommodation with downloaded images displayed. There is a map with specific area infrastructure, so users can view the location of the nearest stores, fitness clubs, parks and pedestrian areas, schools, and daycares. The detailed info about the accommodation and its facilities is also shown.
            - paragraph [ref=f5e129]: Users can add objects to bookmarks, share the link, view 3D video tours, or checkout directly. An advertising banner informes users of getting a discount for the first rental.
            - paragraph [ref=f5e130]: Share your thoughts on this post in the comments!
            - paragraph [ref=f5e131]:
              - text: Don't forget to follow our
              - link "Cleveroad Team" [ref=f5e132] [cursor=pointer]:
                - /url: https://dribbble.com/cleveroad
              - text: "!"
